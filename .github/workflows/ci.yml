name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  BUN_VERSION: 1.1.34

jobs:
  biome:
    name: biome
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: install
        run: bun install --frozen-lockfile
      - name: biome check
        run: bun run check:ci

  architecture-rules:
    name: architecture-rules
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: install
        run: bun install --frozen-lockfile
      - name: lint-rules
        run: bun run lint:rules

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: install
        run: bun install --frozen-lockfile
      - name: typecheck
        run: bun run typecheck

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: install
        run: bun install --frozen-lockfile
      - name: vitest
        run: bun run test:run

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: install
        run: bun install --frozen-lockfile
      - name: coverage
        run: bun run test:coverage
      - name: upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: install
        run: bun install --frozen-lockfile
      - name: build
        run: bun run build
      - name: bundle stats
        shell: bash
        run: |
          {
            echo "## bundle"
            echo ""
            echo '```'
            ls -lh dist/assets | awk 'NR>1 { printf "%-12s %s\n", $5, $9 }'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  knip:
    name: knip
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: install
        run: bun install --frozen-lockfile
      - name: knip
        run: bun run knip

  licenses:
    name: licenses
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: install
        run: bun install --frozen-lockfile
      - name: licenses
        run: bun run licenses

  typos:
    name: typos
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
      - uses: crate-ci/typos@v1

  size-limit:
    name: size-limit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build]
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: install
        run: bun install --frozen-lockfile
      - name: download dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: size
        run: bun run size

  all-green:
    name: all-green
    runs-on: ubuntu-latest
    timeout-minutes: 1
    if: always()
    needs:
      [
        biome,
        architecture-rules,
        typecheck,
        test,
        coverage,
        build,
        knip,
        licenses,
        typos,
        size-limit,
      ]
    steps:
      - name: gate
        uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
